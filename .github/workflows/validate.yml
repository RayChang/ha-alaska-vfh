name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  hassfest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run tests
        run: |
          pip install pytest
          pytest tests -q

  tests-homeassistant:
    # pytest-homeassistant-custom-component 0.13.325 pins Home Assistant 2026.4.4
    # (the minimum in hacs.json is 2026.4.0) and needs Python 3.14. pymodbus is pinned
    # to the version required by the modbus component of that Home Assistant release.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Run Home Assistant level tests
        run: |
          pip install pytest-homeassistant-custom-component==0.13.325 pymodbus==3.11.2
          pytest tests -q -o asyncio_mode=auto
